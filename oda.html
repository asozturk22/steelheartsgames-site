<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sesli Oda · Davet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Sesli Oda davet sayfası: linkin # kısmındaki oda bilgisini programa iletir. # sonrası sunucuya hiç gönderilmez. */
:root{--bg:#0d0c0b;--iron:#171513;--iron-2:#211e1b;--line:#34302b;--steel:#d9dbde;--steel-dim:#9a9690;--ember:#ff7a2f;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-body:"Barlow",system-ui,"Segoe UI",sans-serif;--f-mono:"Share Tech Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 50% 0%,color-mix(in srgb,var(--ember) 14%,transparent),transparent 70%),var(--bg);color:var(--steel);font-family:var(--f-body);font-size:17px;line-height:1.6}
.card{width:100%;max-width:460px;background:var(--iron);border:1px solid var(--line);border-radius:18px;padding:32px 28px;text-align:center;box-shadow:0 30px 60px -30px #000}
.icon{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;background:var(--iron-2);border:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1.05;margin:8px 0 6px;letter-spacing:.01em;word-break:break-word}
p{margin:0 0 6px;color:var(--steel-dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:14px;border-radius:12px;font:600 1.05rem var(--f-body);text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--ember);color:#1a0d05}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--steel);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ember)}
.note{font-size:.85rem;margin-top:18px}
.err{color:#ff8a7a}
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ff7a2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="2" y="14" width="5" height="7" rx="2"></rect><rect x="17" y="14" width="5" height="7" rx="2"></rect></svg>
  </div>
  <p class="eyebrow" id="t-eyebrow">Sesli Oda daveti</p>
  <h1 id="room">Sesli Oda</h1>
  <p id="t-lead">Sesli Oda açılıyor…</p>
  <a class="btn primary" id="open" href="#">Sesli Oda'da aç</a>
  <a class="btn ghost" id="dl" href="https://github.com/asozturk22/sesli-oda/releases/latest/download/SesliOda-Setup.exe">Windows için indir</a>
  <p class="note" id="t-note">Program kurulu değilse önce indirip kur, sonra bu sayfaya geri dönüp "Sesli Oda'da aç"a bas. Windows "Bilgisayarınız korundu" derse "Ek bilgi → Yine de çalıştır" de.</p>
</main>
<script>
(function () {
  var tr = /^tr\b/i.test(navigator.language || '');
  var T = tr ? {} : {
    eyebrow: 'Sesli Oda invite', lead: 'Opening Sesli Oda…', open: 'Open in Sesli Oda', dl: 'Download for Windows',
    note: 'If the app is not installed, download and install it first, then come back and press "Open in Sesli Oda". If Windows says "Windows protected your PC", choose "More info → Run anyway".',
    bad: 'This invite link is not valid.'
  };
  if (!tr) {
    document.documentElement.lang = 'en';
    document.getElementById('t-eyebrow').textContent = T.eyebrow;
    document.getElementById('t-lead').textContent = T.lead;
    document.getElementById('open').textContent = T.open;
    document.getElementById('dl').textContent = T.dl;
    document.getElementById('t-note').textContent = T.note;
  }
  var d = (location.hash || '').slice(1);
  var room = '';
  try {
    var bin = atob(d.replace(/-/g, '+').replace(/_/g, '/'));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    room = String(JSON.parse(new TextDecoder().decode(bytes)).r || '');
  } catch (e) { room = ''; }
  var openBtn = document.getElementById('open');
  if (!/^[A-Za-z0-9_-]{4,}$/.test(d) || !room) {
    document.getElementById('t-lead').textContent = tr ? 'Bu davet linki geçerli değil.' : T.bad;
    document.getElementById('t-lead').className = 'err';
    openBtn.style.display = 'none';
    return;
  }
  // Oda adı sayfada gösterilir; şifre asla gösterilmez
  document.getElementById('room').textContent = room.slice(0, 40);
  var target = 'sesli-oda://join?d=' + d;
  openBtn.href = target;
  setTimeout(function () { location.href = target; }, 400);
})();
</script>
</body>
</html>
